name: experience_lab_tracker
description: BUas Experience Lab GPS Tracking client (Flutter, Android + iOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.7.0

  # Sensors / location
  geolocator: ^13.0.1
  sensors_plus: ^6.1.0
  battery_plus: ^6.0.3

  # Background execution (foreground service on Android)
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.3

  # Permissions
  permission_handler: ^11.3.1

  # Device + storage + ids
  device_info_plus: ^11.1.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

  # State management + formatting
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/buas_logo.png
